[project]
name = "claims"
version = "0.1.0"
description = "End-to-end insurance claims processing: FNOL intake, document extraction, fraud scoring, settlement recommendation, adjuster HITL, hash-chained audit."
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claims"]

[tool.pytest.ini_options]
testpaths = ["tests"]
